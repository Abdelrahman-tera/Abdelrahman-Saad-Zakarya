services:
  db:
    image: postgres:16-alpine
    container_name: agro_erp_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-agrochemical_erp}
      POSTGRES_USER: ${DB_USER:-erp_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secure_database_password_here}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-erp_admin} -d ${DB_NAME:-agrochemical_erp}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - erp_network

  redis:
    image: redis:7-alpine
    container_name: agro_erp_redis
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - erp_network

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: agro_erp_backend
    restart: always
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-egy-agro-erp-production-grade-secret-key-2026}
      DJANGO_ALLOWED_HOSTS: "*"
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: ${DB_NAME:-agrochemical_erp}
      DB_USER: ${DB_USER:-erp_admin}
      DB_PASSWORD: ${DB_PASSWORD:-secure_database_password_here}
      DB_HOST: db
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    networks:
      - erp_network

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: agro_erp_celery
    restart: always
    command: celery -A config worker -l info --concurrency=2
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-egy-agro-erp-production-grade-secret-key-2026}
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: ${DB_NAME:-agrochemical_erp}
      DB_USER: ${DB_USER:-erp_admin}
      DB_PASSWORD: ${DB_PASSWORD:-secure_database_password_here}
      DB_HOST: db
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - erp_network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: agro_erp_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    volumes:
      - static_volume:/usr/share/nginx/html/static:ro
      - media_volume:/usr/share/nginx/html/media:ro
    networks:
      - erp_network

volumes:
  postgres_data:
    driver: local
  static_volume:
    driver: local
  media_volume:
    driver: local

networks:
  erp_network:
    driver: bridge
